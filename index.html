                <div className="pt-2 border-t border-terracotta-500/10 flex items-center justify-between text-xs">
                  <span className="font-bold text-white">আহমেদ ফয়সাল</span>
                  <span className="text-amberClay-400/70">মোহাম্মদপুর, ঢাকা</span>
                </div>
              </div>

              <div className="p-5 rounded-xl bg-terracotta-950/80 border border-terracotta-500/20 space-y-3 shadow-md">
                <div className="flex text-amberClay-400 text-sm">★★★★★</div>
                <p className="text-xs sm:text-sm text-amberClay-100/90 italic">
                  "টেরাকোটার দেয়াল প্যানেল অর্ডার করেছিলাম। বাবল র‍্যাপ দিয়ে এত যত্ন করে প্যাকেজিং করে পাঠিয়েছে যে একটা আঁচড়ও লাগেনি।"
                </p>
                <div className="pt-2 border-t border-terracotta-500/10 flex items-center justify-between text-xs">
                  <span className="font-bold text-white">নাজমা বেগম</span>
                  <span className="text-amberClay-400/70">গুলশান, ঢাকা</span>
                </div>
              </div>

              <div className="p-5 rounded-xl bg-terracotta-950/80 border border-terracotta-500/20 space-y-3 shadow-md">
                <div className="flex text-amberClay-400 text-sm">★★★★★</div>
                <p className="text-xs sm:text-sm text-amberClay-100/90 italic">
                  "তাজমহল রোডের শোরুমটা ঘুরে দেখে মুগ্ধ হয়েছি। আমাদের দেশীয় ঐতিহ্যকে এত আধুনিক রূপ দিয়ে সাজানো সত্যিই প্রশংসনীয়।"
                </p>
                <div className="pt-2 border-t border-terracotta-500/10 flex items-center justify-between text-xs">
                  <span className="font-bold text-white">ড. কামরুল হাসান</span>
                  <span className="text-amberClay-400/70">ধানমন্ডি, ঢাকা</span>
                </div>
              </div>

            </div>
          </section>

          {/* 7. FOOTER */}
          <footer className="mt-auto bg-terracotta-950 border-t border-terracotta-500/30 pt-12 pb-24 md:pb-12 text-xs sm:text-sm text-amberClay-300/80">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-8">
              
              <div className="grid grid-cols-1 md:grid-cols-4 gap-8">
                <div className="space-y-3 md:col-span-2">
                  <div className="flex items-center gap-2">
                    <span className="w-8 h-8 rounded-full bg-terracotta-800 border border-amberClay-400 flex items-center justify-center font-serif font-black text-amberClay-300 text-lg">বে</span>
                    <span className="font-serif font-bold text-lg text-white">বেঙ্গল টেরাকোটা এন্ড হ্যান্ডিক্র্যাফ্ট</span>
                  </div>
                  <p className="text-xs text-amberClay-300/70 max-w-md">
                    মোহাম্মদপুর তাজমহল রোডের স্বনামধন্য ঐতিহ্যবাহী পোড়ামাটি ও এন্টিক হস্তশিল্প প্রতিষ্ঠান।
                  </p>
                  <div className="flex items-center gap-3 pt-2">
                    <a href={FB_LINK} target="_blank" rel="noopener noreferrer" className="p-2 rounded bg-terracotta-900 border border-terracotta-500/30 hover:border-amberClay-400 text-amberClay-300">
                      ফেসবুক পেজ (৫.৩কে+)
                    </a>
                  </div>
                </div>

                <div className="space-y-2">
                  <p className="font-bold text-white uppercase text-xs tracking-wider text-amberClay-400">দ্রুত লিংক</p>
                  <ul className="space-y-1.5 text-xs">
                    <li><a href="#collection" className="hover:text-amberClay-300">হস্তশিল্প কালেকশন</a></li>
                    <li><a href="#showroom" className="hover:text-amberClay-300">তাজমহল রোড শোরুম</a></li>
                    <li><a href={`tel:${BRAND_PHONE}`} className="hover:text-amberClay-300">হটলাইনে কল করুন</a></li>
                  </ul>
                </div>

                <div className="space-y-2">
                  <p className="font-bold text-white uppercase text-xs tracking-wider text-amberClay-400">কনসেপ্ট ডেমো ক্রেডিট</p>
                  <p className="text-xs leading-relaxed text-amberClay-300/70">
                    এটি একটি প্রিমিয়াম ই-কমার্স কনসেপ্ট ডেমো। ডিজাইন ও ডেভেলপ করেছে <a href="https://cryptowebbuild.com" target="_blank" rel="noopener noreferrer" className="text-amberClay-300 font-bold underline">CryptoWebBuild</a>।
                  </p>
                </div>
              </div>

              <div className="pt-6 border-t border-terracotta-500/20 flex flex-col sm:flex-row items-center justify-between gap-4 text-center sm:text-left text-xs">
                <p>© ২০২৬ বেঙ্গল টেরাকোটা এন্ড হ্যান্ডিক্র্যাফ্ট. সর্বস্বত্ব সংরক্ষিত।</p>
                <p className="text-amberClay-400 font-medium">
                  Preserving Traditional Terracotta & Craft Heritage of Bengal
                </p>
              </div>

            </div>
          </footer>

          {/* 8. ORDER / WHATSAPP DRAWER MODAL */}
          {orderModalProduct && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fade-in">
              <div 
                className="bg-terracotta-950 border border-terracotta-400/60 rounded-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto shadow-2xl p-6 relative text-amberClay-50"
                onClick={(e) => e.stopPropagation()}
              >
                
                {/* Close Button */}
                <button 
                  onClick={() => setOrderModalProduct(null)}
                  className="absolute top-4 right-4 text-amberClay-300 hover:text-white p-1 rounded-full bg-terracotta-900 border border-terracotta-500/20"

                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/>
                  </svg>
                </button>

                <div className="flex items-center gap-3 mb-4 pb-3 border-b border-terracotta-500/20">
                  <img 
                    src={orderModalProduct.image} 
                    alt={orderModalProduct.title} 
                    className="w-16 h-16 rounded-xl object-cover border border-terracotta-500/40"
                  />
                  <div>
                    <span className="text-[10px] text-amberClay-400 font-mono font-bold uppercase">{orderModalProduct.code}</span>
                    <h3 className="text-sm sm:text-base font-bold text-white line-clamp-1">{orderModalProduct.title}</h3>
                    <p className="text-sm font-extrabold text-amberClay-300">
                      ৳{orderModalProduct.price.toLocaleString('en-IN')}
                    </p>
                  </div>
                </div>

                <form onSubmit={handleWhatsAppSubmit} className="space-y-4 text-xs sm:text-sm">
                  
                  {/* Quantity selector */}
                  <div className="flex items-center justify-between bg-terracotta-900/60 p-2.5 rounded-xl border border-terracotta-500/20">
                    <span className="font-semibold text-amberClay-200">পিসের সংখ্যা:</span>
                    <div className="flex items-center gap-3">
                      <button 
                        type="button"
                        onClick={() => setQuantity(Math.max(1, quantity - 1))}
                        className="w-7 h-7 rounded bg-terracotta-800 text-amberClay-300 font-bold border border-terracotta-500/30 flex items-center justify-center hover:bg-terracotta-700"
                      >-</button>
                      <span className="font-bold text-base text-white">{quantity}</span>
                      <button 
                        type="button"
                        onClick={() => setQuantity(quantity + 1)}
                        className="w-7 h-7 rounded bg-terracotta-800 text-amberClay-300 font-bold border border-terracotta-500/30 flex items-center justify-center hover:bg-terracotta-700"
                      >+</button>
                    </div>
                  </div>

                  {/* Delivery Mode Choice */}
                  <div className="space-y-1.5">
                    <label className="block text-xs font-bold text-amberClay-300">ডেলিভারি / রিসিভ অপশন:</label>
                    <div className="grid grid-cols-1 gap-2">
                      <label className={`flex items-center justify-between p-2.5 rounded-xl border cursor-pointer text-xs ${deliveryOption === 'dhaka' ? 'border-terracotta-400 bg-terracotta-900/80 text-white font-bold' : 'border-terracotta-500/20 bg-terracotta-950 text-amberClay-200'}`}>
                        <div className="flex items-center gap-2">
                          <input 
                            type="radio" 
                            name="delivery" 
                            value="dhaka" 
                            checked={deliveryOption === 'dhaka'} 
                            onChange={(e) => setDeliveryOption(e.target.value)}
                            className="accent-terracotta-500"
                          />
                          <span>ঢাকা সিটির ভেতরে হোম ডেলিভারি</span>
                        </div>
                        <span className="text-amberClay-300 font-mono">৳৭০</span>
                      </label>

                      <label className={`flex items-center justify-between p-2.5 rounded-xl border cursor-pointer text-xs ${deliveryOption === 'outside' ? 'border-terracotta-400 bg-terracotta-900/80 text-white font-bold' : 'border-terracotta-500/20 bg-terracotta-950 text-amberClay-200'}`}>
                        <div className="flex items-center gap-2">
                          <input 
                            type="radio" 
                            name="delivery" 
                            value="outside" 
                            checked={deliveryOption === 'outside'} 
                            onChange={(e) => setDeliveryOption(e.target.value)}
                            className="accent-terracotta-500"
                          />
                          <span>ঢাকার বাইরে সুন্দরবন / এসএ পরিবহন</span>
                        </div>
                        <span className="text-amberClay-300 font-mono">৳১৩০</span>
                      </label>

                      <label className={`flex items-center justify-between p-2.5 rounded-xl border cursor-pointer text-xs ${deliveryOption === 'pickup' ? 'border-terracotta-400 bg-terracotta-900/80 text-white font-bold' : 'border-terracotta-500/20 bg-terracotta-950 text-amberClay-200'}`}>
                        <div className="flex items-center gap-2">
                          <input 
                            type="radio" 
                            name="delivery" 
                            value="pickup" 
                            checked={deliveryOption === 'pickup'} 
                            onChange={(e) => setDeliveryOption(e.target.value)}
                            className="accent-terracotta-500"
                          />
                          <span>মোহাম্মদপুর শোরুম পিকআপ (তাজমহল রোড)</span>
                        </div>
                        <span className="text-emerald-400 font-bold">ফ্রি (৳০)</span>
                      </label>
                    </div>
                  </div>

                  {/* Customer Inputs */}
                  <div className="space-y-2">
                    <div>
                      <label className="block text-xs font-bold text-amberClay-200 mb-1">আপনার নাম *</label>
                      <input 
                        type="text" 
                        required
                        placeholder="আপনার সম্পূর্ণ নাম লিখুন"
                        value={customerName}
                        onChange={(e) => setCustomerName(e.target.value)}
                        className="w-full bg-terracotta-900 border border-terracotta-500/30 rounded-lg px-3 py-2 text-white placeholder-amberClay-300/40 text-xs sm:text-sm focus:outline-none focus:border-terracotta-400"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-amberClay-200 mb-1">মোবাইল নম্বর *</label>
                      <input 
                        type="tel" 
                        required
                        placeholder="০১XXXXXXXXX"
                        value={customerPhone}
                        onChange={(e) => setCustomerPhone(e.target.value)}
                        className="w-full bg-terracotta-900 border border-terracotta-500/30 rounded-lg px-3 py-2 text-white placeholder-amberClay-300/40 text-xs sm:text-sm focus:outline-none focus:border-terracotta-400"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-amberClay-200 mb-1">
                        {deliveryOption === 'pickup' ? 'শোরুমে আসার সম্ভাব্য দিন/সময়' : 'ডেলিভারি ঠিকানা *'}
                      </label>
                      <textarea 
                        rows="2"
                        placeholder={deliveryOption === 'pickup' ? 'কখন শোরুমে আসবেন লিখুন' : 'বাসা নং, রোড, থানা, জেলা'}
                        value={customerAddress}
                        onChange={(e) => setCustomerAddress(e.target.value)}
                        className="w-full bg-terracotta-900 border border-terracotta-500/30 rounded-lg px-3 py-2 text-white placeholder-amberClay-300/40 text-xs sm:text-sm focus:outline-none focus:border-terracotta-400"
                      ></textarea>
                    </div>
                  </div>

                  {/* Total Calculation */}
                  <div className="bg-terracotta-900/80 rounded-xl p-3 border border-terracotta-400/40 space-y-1 text-xs">
                    <div className="flex justify-between text-amberClay-300">
                      <span>পণ্যের সাবটোটাল:</span>
                      <span>৳{(orderModalProduct.price * quantity).toLocaleString('en-IN')}</span>
                    </div>
                    <div className="flex justify-between text-amberClay-300">
                      <span>ডেলিভারি চার্জ:</span>
                      <span>{deliveryCost === 0 ? 'ফ্রি' : `৳${deliveryCost}`}</span>
                    </div>
                    <div className="flex justify-between text-base font-extrabold text-amberClay-300 pt-1 border-t border-terracotta-500/20">
                      <span>সর্বমোট প্রদেয়:</span>
                      <span>৳{grandTotal.toLocaleString('en-IN')}</span>
                    </div>
                  </div>

                  {/* Submit Button */}
                  <button 
                    type="submit"
                    className="w-full py-3.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm transition shadow-lg shadow-emerald-950 flex items-center justify-center gap-2"
                  >
                    <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                      <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/>
                    </svg>
                    <span>১-ক্লিকে হোয়াটসঅ্যাপে বুকিং সম্পন্ন করুন</span>
                  </button>

                  <p className="text-[10px] text-center text-amberClay-300/60">
                    * আপনার দেওয়া তথ্য নিয়ে সরাসরি বেঙ্গল টেরাকোটার অফিসিয়াল হোয়াটসঅ্যাপ ওপেন হবে।
                  </p>

                </form>

              </div>
            </div>
          )}

          {/* 9. HIGH RESOLUTION IMAGE ZOOM LIGHTBOX */}
          {zoomImage && (
            <div 
              className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-md animate-fade-in"
              onClick={() => setZoomImage(null)}
            >
              <div className="relative max-w-4xl max-h-[90vh] overflow-hidden rounded-2xl border border-terracotta-500/40 bg-terracotta-950">
                <button 
                  onClick={() => setZoomImage(null)}
                  className="absolute top-4 right-4 text-white p-2 rounded-full bg-terracotta-950/80 border border-terracotta-500/30 hover:bg-terracotta-500 transition z-10"
                >
                  <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/>
                  </svg>
                </button>
                <img 
                  src={zoomImage} 
                  alt="বেঙ্গল টেরাকোটা এন্ড হ্যান্ডিক্র্যাফ্ট পণ্য ভিউ" 
                  className="w-full h-auto max-h-[85vh] object-contain"
                />
              </div>
            </div>
          )}

          {/* 10. MOBILE BOTTOM FLOATING ACTION BAR */}
          <div className="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-terracotta-950/95 backdrop-blur-md border-t border-terracotta-500/30 p-2.5 flex items-center gap-2">
            <a 
              href={`tel:${BRAND_PHONE}`}
              className="flex-1 py-2.5 rounded-xl bg-terracotta-900 border border-terracotta-500/40 text-amberClay-300 font-bold text-xs flex items-center justify-center gap-1.5"
            >
              <svg className="w-4 h-4 text-amberClay-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
              </svg>
              <span>হটলাইনে কল</span>
            </a>

            <a 
              href={`https://wa.me/${WHATSAPP_NUM}`}
              target="_blank"
              rel="noopener noreferrer"
              className="flex-1 py-2.5 rounded-xl bg-emerald-600 text-white font-bold text-xs flex items-center justify-center gap-1.5 shadow-md"
            >
              <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/>
              </svg>
              <span>হোয়াটসঅ্যাপ চ্যাট</span>
            </a>
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
